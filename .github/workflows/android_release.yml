name: Android Release (signed AAB)

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Secrets to add in GitHub -> Settings -> Secrets and variables -> Actions:
    #   KEYSTORE_BASE64  (base64 of your upload keystore .jks)
    #   STORE_PASSWORD, KEY_PASSWORD
    - name: Decode upload keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        test -n "$KEYSTORE_BASE64" || { echo "Missing GitHub Actions secret: KEYSTORE_BASE64" >&2; exit 1; }
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
        test -s "$RUNNER_TEMP/upload.jks" || { echo "Decoded upload keystore is empty" >&2; exit 1; }
        echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

    - name: Build signed release AAB
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        test -n "$STORE_PASSWORD" || { echo "Missing GitHub Actions secret: STORE_PASSWORD" >&2; exit 1; }
        test -n "$KEY_PASSWORD" || { echo "Missing GitHub Actions secret: KEY_PASSWORD" >&2; exit 1; }
        chmod +x gradlew
        ./gradlew bundleRelease --no-daemon

    - uses: actions/upload-artifact@v4
      with:
        name: Snug-Release-AAB
        path: app/build/outputs/bundle/release/*.aab
